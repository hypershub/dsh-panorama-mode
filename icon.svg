<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AVA stage">
  <defs>
    <radialGradient id="core" cx="38%" cy="30%" r="72%">
      <stop offset="0" stop-color="#FFE0C6"/>
      <stop offset=".42" stop-color="#FF7A55"/>
      <stop offset="1" stop-color="#7A2410"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB067"/>
      <stop offset="1" stop-color="#8AA2FF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#08090F"/>
  <circle cx="32" cy="31" r="21" fill="none" stroke="#FF6B4A" stroke-opacity=".16" stroke-width="1"/>
  <g filter="url(#glow)">
    <circle cx="32" cy="31" r="11.5" fill="url(#core)"/>
  </g>
  <circle cx="32" cy="31" r="17.5" fill="none" stroke="url(#ring)" stroke-opacity=".55" stroke-width="1.1"
          stroke-dasharray="34 14" transform="rotate(-28 32 31)"/>
  <circle cx="45.5" cy="22" r="1.7" fill="#FFE7D6"/>
  <circle cx="18.5" cy="38" r="1.3" fill="#8AA2FF" fill-opacity=".85"/>
  <circle cx="38" cy="47" r="1.1" fill="#FFB067" fill-opacity=".9"/>
</svg>
